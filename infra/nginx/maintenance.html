<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PneumoAI Maintenance</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b1020;
        color: #e6ebff;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        max-width: 720px;
        padding: 28px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        background: rgba(255,255,255,0.04);
      }
      h1 {
        margin-top: 0;
      }
      .muted {
        color: #9aa6c7;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>PneumoAI is temporarily unavailable</h1>
      <p class="muted">
        Scheduled maintenance window: 9:00 PM–7:15 AM IST.
        If you are seeing this outside that window, the service is still starting up or temporarily down.
      </p>
    </div>
  </body>
</html>
