services:
  redis:
    image: redis:7-alpine
    container_name: pneumoai-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pneumoai:
    build: .
    container_name: pneumoai
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - API_PORT=8000
      - MODEL_DEVICE=cpu
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    build: .
    container_name: pneumoai-worker
    command: ["python", "scripts/run_worker.py"]
    env_file:
      - .env
    environment:
      - MODEL_DEVICE=cpu
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      pneumoai:
        condition: service_started
    restart: unless-stopped