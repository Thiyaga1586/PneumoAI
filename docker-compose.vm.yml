services:
  postgres:
    image: postgres:15-alpine
    container_name: pneumoai-postgres
    environment:
      POSTGRES_DB: pneumoai
      POSTGRES_USER: pneumoai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pneumoai -d pneumoai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pneumoai-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pneumoai:
    image: ghcr.io/thiyaga1586/pneumoai@sha256:7234722ba8ccd68cea97695659ef3ceca40db8ffe87b46d9bb6322b33b8ae9fa
    container_name: pneumoai
    env_file:
      - .env.production
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://pneumoai:${POSTGRES_PASSWORD}@postgres:5432/pneumoai
      - MODEL_DEVICE=cpu
    expose:
      - "8000"
    volumes:
      - pneumoai_runtime:/app/data/runtime
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5).read()"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  worker:
    image: ghcr.io/thiyaga1586/pneumoai@sha256:7234722ba8ccd68cea97695659ef3ceca40db8ffe87b46d9bb6322b33b8ae9fa
    container_name: pneumoai-worker
    command: ["python", "scripts/run_worker.py"]
    env_file:
      - .env.production
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://pneumoai:${POSTGRES_PASSWORD}@postgres:5432/pneumoai
      - MODEL_DEVICE=cpu
    volumes:
      - pneumoai_runtime:/app/data/runtime
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pneumoai:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: pneumoai-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      pneumoai:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  pneumoai_runtime: