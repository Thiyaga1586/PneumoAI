name: PneumoAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify model artifacts
        run: |
          git lfs pull
          python - <<'PY'
          from pathlib import Path
          p = Path("models/v2/model.pth")
          head = p.read_bytes()[:80]
          print(head)
          assert not head.startswith(b"version https://git-lfs.github.com"), "LFS pointer checked out instead of model"
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run unit tests
        env:
          PYTHONPATH: src
          MODEL_DEVICE: cpu
        run: |
          python -m pytest tests/unit -q

  docker-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify model artifacts
        run: |
          git lfs pull
          python - <<'PY'
          from pathlib import Path
          p = Path("models/v2/model.pth")
          head = p.read_bytes()[:80]
          print(head)
          assert not head.startswith(b"version https://git-lfs.github.com"), "LFS pointer checked out instead of model"
          PY

      - name: Build Docker stack
        run: |
          docker compose build --no-cache

      - name: Start Docker stack
        run: |
          docker compose up -d

      - name: Run Docker smoke test
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow
          python scripts/smoke/docker_smoke_test.py

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs pneumoai --tail=200
          docker compose logs worker --tail=200