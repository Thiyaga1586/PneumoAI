name: PneumoAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify model artifacts
        run: |
          git lfs pull
          python - <<'PY'
          from pathlib import Path
          p = Path("models/v2/model.pth")
          head = p.read_bytes()[:80]
          print(head)
          assert not head.startswith(b"version https://git-lfs.github.com"), "LFS pointer checked out instead of model"
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run unit tests
        env:
          PYTHONPATH: src
          MODEL_DEVICE: cpu
        run: |
          python -m pytest tests/unit -q

  docker-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify model artifacts
        run: |
          git lfs pull
          python - <<'PY'
          from pathlib import Path
          p = Path("models/v2/model.pth")
          head = p.read_bytes()[:80]
          print(head)
          assert not head.startswith(b"version https://git-lfs.github.com"), "LFS pointer checked out instead of model"
          PY

      - name: Build Docker stack
        run: |
          docker compose build --no-cache
      
      - name: Create CI env file
        run: |
          cat > .env <<'EOF'
          APP_NAME=PneumoAI
          ENV=ci
          API_HOST=0.0.0.0
          API_PORT=8000
          LOG_LEVEL=INFO
          MODEL_DEVICE=cpu
          DEFAULT_MODEL_VERSION=v1
          MODELS_DIR=models
          RUNTIME_DIR=data/runtime
          SQLITE_PATH=data/runtime/requests.db
          INFERENCE_BACKEND=local
          TRITON_ENABLED=false
          TRITON_URL=localhost:8001
          TRITON_FALLBACK_TO_LOCAL=true
          MAX_UPLOAD_MB=10
          ADMIN_API_KEY=ci-test-key
          MLFLOW_TRACKING_URI=sqlite:///data/runtime/mlflow.db
          MLFLOW_EXPERIMENT_NAME=pneumoai
          REDIS_ENABLED=true
          REDIS_URL=redis://redis:6379/0
          REDIS_QUEUE_KEY=pneumoai:queue:predict
          WORKER_POLL_INTERVAL_SECONDS=1.0
          EOF

          
      - name: Start Docker stack
        run: |
          docker compose up -d

      - name: Wait for API readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/ready; then
              echo "API ready"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 5
          done

          echo "API failed to become ready"
          docker compose ps
          docker compose logs pneumoai --tail=200
          exit 1

      - name: Run Docker smoke test
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow
          python scripts/smoke/docker_smoke_test.py

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs pneumoai --tail=200
          docker compose logs worker --tail=200