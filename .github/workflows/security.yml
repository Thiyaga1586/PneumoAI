name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TRIVY_DISABLE_VEX_NOTICE: true

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build serving image
        run: docker build -t pneumoai:ci .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pneumoai:ci
          format: table
          exit-code: 0
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH