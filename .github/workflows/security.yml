name: Security Scan

on:
 push:
 pull_request:

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pneumoai .

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: pneumoai
          format: table
          exit-code: 1
          vuln-type: os,library
          severity: HIGH,CRITICAL